services:
  - type: web
    name: chart-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CORS_ORIGINS
        value: https://chart-ankilmodi.vercel.app
      - key: LOG_LEVEL
        value: INFO
      - key: REFRESH_INTERVAL_SECONDS
        value: "60"
